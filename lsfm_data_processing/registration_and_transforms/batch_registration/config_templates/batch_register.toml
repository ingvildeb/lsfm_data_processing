# lsfm_template_id = registration_and_transforms/1_batch_register
# lsfm_schema_version = 1
# lsfm_template_revision = 2026-07-09
[run]
registration_preset = "tuned_syn_cc"
template_role = "moving"   # use "moving" for template -> subject, "fixed" for subject -> template
output_subdir = "_01_registration"
orientation_alignment = "fixed_to_moving"
write_input_images = false

[subject_defaults]
subjects_dir = "subjects"
image_name = "ch1_iso20um.nii.gz"
orientation = "las"
resolution_um = 20.0
underscores_to_id = 0      # set to 0 if folder names are just subject IDs

[segmentation_transform]
enabled = false
output_subdir = "_02_template_segmentations"
interpolation = "genericLabel"
write_intermediates = false

[templates.lsfm-neun-v1-p56]
image = "Z:/path/to/template.nii.gz"
space_name = "lsfm-neun-v1-p56"
orientation = "lsp"
resolution_um = 20.0

[templates.lsfm-neun-v1-p56.segmentations]
mask = "Z:/path/to/template_mask.nii.gz"

[subject_to_template]
"IEB0001" = "lsfm-neun-v1-p56"
